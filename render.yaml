# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: cite-checkup
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: "off"
    buildCommand: >-
      npm exec --yes --package=pnpm@11.22.0 -- pnpm install --frozen-lockfile --prod=false
      && npm exec --yes --package=pnpm@11.22.0 -- pnpm build
    startCommand: node node_modules/next/dist/bin/next start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: npm_config_registry
        value: https://registry.npmjs.org
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: OPENALEX_API_KEY
        sync: false
      - key: OPENALEX_SEARCH_BUDGET
        value: "20"
      - key: CROSSREF_MAILTO
        sync: false
